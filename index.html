<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- FOUC prevention: apply theme before first paint -->
    <script>
      (function () {
        var t = localStorage.getItem('theme-preference') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <!-- Security headers (meta-tag layer; server headers take precedence in prod) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-1vPsQXKhHBCB8MdNlxgliEHDU7d59rT8u4qRNIjDhwY='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws://localhost:* ws://127.0.0.1:* wss:; frame-ancestors 'none';" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=()" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OpenClaw Command Center — AI Agent Orchestration Dashboard for any OpenClaw Gateway." />
    <title>OpenClaw — Command Center</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
